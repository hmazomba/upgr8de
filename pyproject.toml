[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "upgr8de"
version = "0.1.0"
description = "Read-only Windows hardware and driver discovery CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Hlumisa Mazomba"}]
dependencies = []

[project.scripts]
upgr8de = "upgr8de.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/upgr8de"]
